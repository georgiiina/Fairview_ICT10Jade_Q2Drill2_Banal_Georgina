<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
<title>ICT 10 - Designer</title>
    
    <style>
        :root {
            --bg-color: #faf9f6;
            --card-bg: #ffffff;
            --text-dark: #1a1a1a;
            --text-muted: #757575;
            --accent-gold: #c5a880;
            --accent-hover: #b09168;
            --border-light: #e8e4de;
        }

        body { 
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding-top: 50px;
            padding-bottom: 50px;
        }

        .designer-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-light);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            padding: 40px 35px;
            margin-bottom: 30px;
        }

        .title-sub {
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.75rem;
            color: var(--accent-gold);
            font-weight: 600;
            margin-bottom: 8px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: var(--text-dark);
            font-size: 2.25rem;
            letter-spacing: -0.5px;
            margin-bottom: 25px;
        }

        .form-control-custom {
            background-color: #fbfbfb;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.95rem;
            color: var(--text-dark);
            transition: all 0.2s ease;
        }

        .form-control-custom:focus {
            background-color: #ffffff;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(197, 168, 128, 0.15);
            outline: none;
        }

        .form-control-custom::placeholder {
            color: #aaa;
            font-weight: 300;
        }

        .btn-designer {
            background-color: var(--text-dark);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            width: 100%;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-designer:hover {
            background-color: var(--accent-gold);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .output-header {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        #output1 { 
            min-height: 180px; 
            border: 1px dashed var(--accent-gold); 
            border-radius: 12px;
            padding: 20px; 
            background-color: #fdfcfb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row">
        <div class="col-lg-6 col-md-8 mx-auto text-center">
            
            
            <div class="designer-card">
                <div class="title-sub">VIP Registry</div>
                <h1>Designer Club Members</h1>
                
                <form action="">
                    <input type="text" id="first_name" class="form-control form-control-custom mb-3" placeholder="First Name">
                    <input type="text" id="last_name" class="form-control form-control-custom mb-3" placeholder="Last Name">
                    <button type="button" id="btn" class="btn btn-designer" py-click="add_member">Add Member</button>
                </form>
            </div>

           
            <div class="designer-card py-4">
                <div class="output-header">All Members</div>
                <div id="output1">
                   
                </div>
            </div>

        </div>
    </div>

    <script type="py" src="main.py"></script>
</div>

</body>
</html>
